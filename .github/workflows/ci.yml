name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci --include-workspace-root --workspace @inlens/core --workspace @inlens/react --workspace @inlens/next

      - name: Lint Package and Test Code
        run: npm run lint:packages

      - name: Check Package and Test Formatting
        run: npm run format:check:packages

      - name: Build and Typecheck Packages
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Test Package Boundaries
        run: npm run test:boundaries

      - name: Test Client Bundle Size
        run: npm run test:size

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Browser Component Tests
        run: npm run test:browser
